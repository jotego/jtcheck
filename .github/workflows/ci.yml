name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'  # daily at 06:17 UTC

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - run: npx eslint .

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: node --check src/analyzer.mjs src/index.mjs src/cli.mjs

      - name: Run tests
        run: node --test

  integration:
    name: Integration test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.4'

      - name: Shallow-clone jtcores
        run: |
          git clone --depth 1 https://github.com/jotego/jtcores.git "$RUNNER_TEMP/jtcores"

      - name: Initialize accessible submodules
        id: submodules
        working-directory: ${{ runner.temp }}/jtcores
        run: |
          git config -f .gitmodules --get-regexp '\.url$' \
          | while read -r key url; do
              path_key="${key/.url/.path}"
              path="$(git config -f .gitmodules --get "$path_key")"
              # Skip orphan .gitmodules entries — listed but not actually
              # registered as mode-160000 in the tree (e.g. jt49/jt89 live
              # nested inside jt12, top-level entries are stale).
              if ! git ls-tree HEAD "$path" 2>/dev/null | grep -q '^160000 commit'; then
                  echo "::notice::Skipping orphan $path — not registered as submodule in tree"
                  continue
              fi
              if [[ "$url" != https://* ]]; then
                  echo "::notice::Skipping SSH-only submodule $path ($url)"
                  echo "$path" >> "$RUNNER_TEMP/skipped_submodules.txt"
                  continue
              fi
              echo "Init: $path ($url)"
              if ! git submodule update --init --recursive -- "$path" 2>&1; then
                  echo "::notice::Could not clone $path — probably a private repo, continuing without it"
                  echo "$path" >> "$RUNNER_TEMP/skipped_submodules.txt"
              fi
          done
          if [ -f "$RUNNER_TEMP/skipped_submodules.txt" ]; then
            list=$(paste -sd, "$RUNNER_TEMP/skipped_submodules.txt")
          else
            list=""
          fi
          echo "skipped=$list" >> "$GITHUB_OUTPUT"

      - name: Build JTFRAME CLI
        env:
          JTROOT: ${{ runner.temp }}/jtcores
        run: |
          export JTFRAME="$JTROOT/modules/jtframe"
          export MODULES="$JTROOT/modules"
          export CORES="$JTROOT/cores"
          export JTBIN="$RUNNER_TEMP/jtbin"
          mkdir -p "$JTBIN"
          "$JTFRAME/bin/jtframe" --help > /dev/null

      - name: Run CLI against real repository
        run: |
          output=$(node src/cli.mjs \
            --repo "$RUNNER_TEMP/jtcores" \
            --changed-files "modules/jtframe/hdl/jtframe_ff.v" \
            --skip-submodules "${{ steps.submodules.outputs.skipped }}")
          echo "$output"
          # Verify the output is valid JSON with expected fields
          echo "$output" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            if (typeof data.affected !== 'object') throw new Error('missing affected');
            if (!Array.isArray(data.unmatchedFiles)) throw new Error('missing unmatchedFiles');
            if (!Array.isArray(data.unresolvedCores)) throw new Error('missing unresolvedCores');
            const n = Object.keys(data.affected).length;
            if (n === 0) throw new Error('jtframe_ff.v should affect at least one core');
            console.log(n + ' cores affected — integration test passed');
          "
