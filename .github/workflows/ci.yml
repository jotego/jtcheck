name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'  # daily at 06:17 UTC

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - run: npx eslint .

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: node --check src/analyzer.mjs src/index.mjs src/cli.mjs

      - name: Run tests
        run: node --test

  integration:
    name: Integration test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.4'

      - name: Shallow-clone jtcores
        run: |
          git clone --depth 1 https://github.com/jotego/jtcores.git "$RUNNER_TEMP/jtcores"

      - name: Initialize accessible submodules
        id: submodules
        uses: ./setup
        with:
          repository-path: ${{ runner.temp }}/jtcores

      - name: Build JTFRAME CLI
        env:
          JTROOT: ${{ runner.temp }}/jtcores
        run: |
          export JTFRAME="$JTROOT/modules/jtframe"
          export MODULES="$JTROOT/modules"
          export CORES="$JTROOT/cores"
          export JTBIN="$RUNNER_TEMP/jtbin"
          mkdir -p "$JTBIN"
          "$JTFRAME/bin/jtframe" --help > /dev/null

      - name: Run integration tests
        env:
          JTCORES_ROOT: ${{ runner.temp }}/jtcores
          JTCHECK_SKIP_SUBMODULES: ${{ steps.submodules.outputs.skipped }}
        run: node --test test/integration.test.mjs
